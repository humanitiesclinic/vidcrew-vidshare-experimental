<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video.js HLS</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet">
</head>
<body>
  <h1>Test D</h1>
  <div id="time-display" style="margin: 10px 0; font-size: 14px;"></div>
  <video id="my-player" class="video-js vjs-default-skin" controls preload="auto" width="640" height="360">
    <source src="https://stream.mux.com/SvqqQy00F02XjvoHso00quQnXvhDqspUyfmn2uJoUqUIFU.m3u8" type="application/x-mpegURL">
    <track kind="captions" src="https://chunk-oci-us-ashburn-1-vop1.fastly.mux.com/v1/subtitle/VVVcQn7VWndhuINWjbsMzMV8tb8EaIMDn2SlwgOBwkHz3yTK5UZjCgo1cjKa8qz2gbvFesLqbcFX4wGATSkqvCwBgbvhLYf01/0.vtt?skid=default&signature=NmFiNmVlZTBfZWEyZGU3YWJjNTUxOGVkOTZhZDljNGYzNWFlMjRlYjMzNDZkOGM5NzU5OTJhNDZiNmVkODVhOGQwZWUxMjQ0MQ==" srclang="en" label="English" default>
    <p class="vjs-no-js">Enable JavaScript</p>
  </video>

  <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
  <script>
    const player = videojs('my-player');
    const SEGMENT_START = 2;
    const SEGMENT_END = 10;
    
    player.on('play', function() {
      player.currentTime(SEGMENT_START);
    });
    
    player.on('timeupdate', function() {
      if (player.currentTime() >= SEGMENT_END) {
        player.pause();
      }
      const current = player.currentTime();
      const duration = player.duration();
      const remaining = duration - current;
      document.getElementById('time-display').textContent = `Time: ${current.toFixed(1)}s / ${duration.toFixed(1)}s (${remaining.toFixed(1)}s left)`;
    });
  </script>
</body>
</html>
