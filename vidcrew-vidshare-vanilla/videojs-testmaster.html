<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Viewer - Mux HLS + Captions</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .player-section { margin: 20px 0; }
        .video-container { margin: 20px 0; }
        #time-display { margin: 10px 0; font-size: 14px; color: #333; font-weight: bold; }
        .caption-list { margin-top: 20px; border: 1px solid #ddd; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        .caption-item { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .caption-item:hover { background: #f9f9f9; }
        .caption-item.active { background: #e3f2fd; border-left: 3px solid #1976d2; }
        .caption-time { font-weight: bold; color: #1976d2; }
        .caption-text { margin-top: 4px; color: #333; }
        .controls { margin: 15px 0; }
        .speed-control { margin: 10px 0; }
        label { font-weight: bold; margin-right: 10px; }
        input[type="range"], select { padding: 5px; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        .info { font-size: 12px; color: #666; margin-top: 10px; }
        .metadata { font-size: 13px; margin: 15px 0; padding: 10px; background: #f9f9f9; border-left: 3px solid #1976d2; }
        .meta-field { margin: 5px 0; }
        .meta-label { font-weight: bold; color: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Viewer | Mux HLS + Captions</h1>
        
        <div class="player-section">
            <div id="time-display"></div>
            <div class="video-container">
                <video id="my-player" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="400">
                    <p class="vjs-no-js">Enable JavaScript for video playback</p>
                </video>
            </div>
            
            <div class="caption-list" id="caption-list"></div>
        </div>

        <div class="controls">
            <h3>Playback Controls</h3>
            
            <div class="speed-control">
                <label for="speed-select">Playback Speed:</label>
                <select id="speed-select">
                    <option value="0.5">0.5x</option>
                    <option value="1">1x (Normal)</option>
                    <option value="1.5" selected>1.5x (Default)</option>
                    <option value="1.25">1.25x</option>
                    <option value="2">2x</option>
                </select>
            </div>

        </div>

        <div class="metadata" id="metadata"></div>

        <div class="info">
            <p><strong>HLS Stream URL:</strong> <code id="stream-url">Loading...</code></p>
            <p id="status">Status: Loading...</p>
            <p id="current-time">Current time: 0s</p>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        // Parse URL params
        const urlParams = new URLSearchParams(window.location.search);
        const muxId = urlParams.get('mux') || '';
        const startTime = parseFloat(urlParams.get('start')) || 0;
        const endTime = parseFloat(urlParams.get('end')) || 8;
        const occasion = urlParams.get('occasion') || 'N/A';
        const year = urlParams.get('year') || 'N/A';
        const tag = urlParams.get('tag') || 'N/A';
        const cue = urlParams.get('cue') || 'N/A';
        const vttUrl = urlParams.get('vtt') || '';
        
        let SEGMENT_START = startTime;
        let SEGMENT_END = endTime;
        let allCues = [];
        
        // Display metadata
        const metadataDiv = document.getElementById('metadata');
        metadataDiv.innerHTML = `
            <div class="meta-field"><span class="meta-label">Occasion:</span> ${escapeHtml(occasion)}</div>
            <div class="meta-field"><span class="meta-label">Year:</span> ${year}</div>
            <div class="meta-field"><span class="meta-label">TAG:</span> ${escapeHtml(tag)}</div>
            <div class="meta-field"><span class="meta-label">Description:</span> ${escapeHtml(cue)}</div>
            <div class="meta-field"><span class="meta-label">Segment:</span> ${startTime.toFixed(1)}s - ${endTime.toFixed(1)}s</div>
        `;
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        const player = videojs('my-player', {
            responsive: true,
            fluid: true
        });

        // Set HLS source
        if (muxId) {
            const hlsUrl = `https://stream.mux.com/${muxId}.m3u8`;
            player.src({
                src: hlsUrl,
                type: 'application/x-mpegURL'
            });
            document.getElementById('stream-url').textContent = hlsUrl;
        }

        // Auto-play on segment start, auto-pause at end
        player.on('play', function() {
            player.currentTime(SEGMENT_START);
        });
        
        player.on('timeupdate', function() {
            const current = player.currentTime();
            const duration = player.duration();
            const remaining = duration - current;
            
            document.getElementById('time-display').textContent = `Time: ${current.toFixed(1)}s / ${duration.toFixed(1)}s (${remaining.toFixed(1)}s left)`;
            document.getElementById('current-time').textContent = `Time: ${current.toFixed(1)}s / ${duration.toFixed(1)}s (${remaining.toFixed(1)}s left)`;
            
            if (current >= SEGMENT_END) {
                player.pause();
            }
        });
        
        player.on('loadedmetadata', function() {
            player.playbackRate(1.5);
            document.getElementById('status').textContent = 'Ready to play ✓';
            if (vttUrl) {
                loadAndInjectCaptions();
            } else {
                document.getElementById('caption-list').innerHTML = '<p style="padding: 10px; color: #999;">No captions available</p>';
            }
        });
        
        async function loadAndInjectCaptions() {
            try {
                const response = await fetch(vttUrl);
                const vttText = await response.text();
                parseCuesFromVTT(vttText);
                renderCaptionList();
                console.log('Captions loaded: ' + allCues.length + ' cues');
            } catch (e) {
                console.error('Error loading captions:', e);
                document.getElementById('caption-list').innerHTML = '<p style="padding: 10px; color: #999;">Error loading captions</p>';
            }
        }
        
        function parseCuesFromVTT(vttText) {
            const lines = vttText.split('\n');
            let i = 0;
            while (i < lines.length) {
                const line = lines[i].trim();
                if (line.includes('-->')) {
                    const [startStr, endStr] = line.split('-->').map(t => t.trim());
                    const start = timeToSeconds(startStr);
                    const end = timeToSeconds(endStr);
                    i++;
                    let text = '';
                    while (i < lines.length && lines[i].trim() !== '') {
                        text += lines[i].trim() + ' ';
                        i++;
                    }
                    if (text.trim()) {
                        allCues.push({ start, end, text: text.trim() });
                    }
                }
                i++;
            }
        }
        
        function timeToSeconds(timeStr) {
            const parts = timeStr.split(':');
            const hours = parseInt(parts[0]) || 0;
            const minutes = parseInt(parts[1]) || 0;
            const seconds = parseFloat(parts[2]) || 0;
            return hours * 3600 + minutes * 60 + seconds;
        }
        
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h > 0 ? h + ':' : ''}${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        
        function renderCaptionList() {
            const list = document.getElementById('caption-list');
            list.innerHTML = '';
            allCues.forEach((cue, idx) => {
                const item = document.createElement('div');
                item.className = 'caption-item';
                item.id = 'caption-' + idx;
                item.innerHTML = `
                    <div class="caption-time">${formatTime(cue.start)} → ${formatTime(cue.end)}</div>
                    <div class="caption-text">${cue.text}</div>
                `;
                item.addEventListener('click', () => {
                    player.currentTime(cue.start);
                    player.play();
                });
                list.appendChild(item);
            });
        }

        // Speed control
        document.getElementById('speed-select').addEventListener('change', function(e) {
            player.playbackRate(parseFloat(e.target.value));
        });

        // Spacebar play/pause control
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (player.paused()) {
                    player.play();
                } else {
                    player.pause();
                }
            }
        });
    </script>
</body>
</html>
